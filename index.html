<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750A4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TIME MGT</title>
<style>
:root{--p:#6750A4;--on-p:#fff;--pc:#EADDFF;--on-pc:#21005D;--bg:#FEF7FF;--sc:#F3EDF7;--sch:#ECE6F0;--tx:#1D1B20;--mut:#6b6573;--ol:#CAC4D0;
  --hi:#B3261E;--mid:#C77700;--lo:#2E7D32}
[data-theme=dark]{--p:#D0BCFF;--on-p:#381E72;--pc:#4F378B;--on-pc:#EADDFF;--bg:#141218;--sc:#211F26;--sch:#2B2930;--tx:#E6E0E9;--mut:#A9A3B2;--ol:#49454F;
  --hi:#F2B8B5;--mid:#F5C451;--lo:#8FD18F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Roboto,sans-serif;min-height:100dvh}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top .g{flex:1}.top h1{font-size:22px;font-weight:600}.top small{color:var(--mut);font-size:13px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--sch);font-size:18px}

.sum{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;background:var(--pc);color:var(--on-pc);margin-bottom:14px}
.ringw{position:relative;width:78px;height:78px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:8}
.ringw .t{stroke:rgba(127,127,127,.25)}.ringw .v{stroke:var(--p);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ringw b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.sum h2{font-size:18px;font-weight:600}.sum p{font-size:13px;opacity:.85;margin-top:4px;line-height:1.6}

.now{padding:16px;border-radius:24px;background:var(--p);color:var(--on-p);margin-bottom:14px}
.now small{opacity:.8;font-size:12px}.now h3{font-size:20px;font-weight:600;margin:4px 0 2px}.now p{font-size:13px;opacity:.85}
.now .r{display:flex;gap:8px;margin-top:12px}
.nb{height:40px;padding:0 18px;border-radius:20px;background:var(--on-p);color:var(--p);font-weight:600;font-size:14px}
.nb.o{background:none;border:1px solid currentColor;color:var(--on-p)}
.nxt{font-size:13px;color:var(--mut);margin:-4px 4px 14px}

.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{height:34px;padding:0 16px;border-radius:10px;border:1px solid var(--ol);font-size:14px}
.chip.on{background:var(--pc);color:var(--on-pc);border-color:transparent}

ul{list-style:none;display:grid;gap:8px}
li{position:relative;overflow:hidden;border-radius:18px;background:var(--sc)}
.sw{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:600}
.sw .a{color:var(--lo)}.sw .d{color:var(--hi)}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sc);touch-action:pan-y;transition:transform .2s}
.card.drag{transition:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ol);flex:none;display:grid;place-items:center;color:transparent;font-size:15px}
.done .box{background:var(--p);border-color:var(--p);color:var(--on-p)}
.done .tt{text-decoration:line-through;color:var(--mut)}
.bd{flex:1;min-width:0}.tt{font-size:16px}
.mt{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--mut);margin-top:4px}
.pri{display:inline-flex;align-items:center;gap:4px}.pri::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pri.high{color:var(--hi)}.pri.mid{color:var(--mid)}.pri.low{color:var(--lo)}
.late{color:var(--hi);font-weight:600}
.ac{display:flex;gap:4px}.ac button{width:38px;height:38px;border-radius:50%;background:var(--sch);font-size:15px}
.empty{text-align:center;color:var(--mut);padding:34px 0;font-size:14px}

.fab{position:fixed;left:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);height:56px;padding:0 22px;border-radius:18px;background:var(--p);color:var(--on-p);
  font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
.pill{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);padding:10px 16px;border-radius:16px;background:var(--pc);color:var(--on-pc);font-weight:600;z-index:5}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden],.pill[hidden]{display:none}
.sb{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;gap:14px}
.sb h2{font-size:20px;font-weight:600}
input[type=text],input[type=time],select{width:100%;height:50px;border:1px solid var(--ol);border-radius:12px;padding:0 12px;font:inherit;background:none;color:var(--tx)}
select option{color:#000}
.row{display:flex;gap:8px}.row>*{flex:1}
.lb{font-size:12px;color:var(--mut);margin-bottom:4px;display:block}
.seg{display:flex;gap:6px}.seg button{flex:1;height:40px;border-radius:12px;border:1px solid var(--ol);font-size:14px}
.seg button.on{background:var(--pc);color:var(--on-pc);border-color:transparent}
.btn{height:48px;border-radius:24px;background:var(--p);color:var(--on-p);font-weight:600;font-size:15px}
.btn.o{background:none;border:1px solid var(--ol);color:var(--p)}

.tm{display:grid;justify-items:center;gap:14px;text-align:center}
.tring{position:relative;width:200px;height:200px}.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:10}.tring .t{stroke:var(--sch)}.tring .v{stroke:var(--p);stroke-linecap:round}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:300;direction:ltr}

.snack{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:#322F35;color:#F5EFF7;padding:12px 16px;border-radius:12px;
  font-size:14px;display:flex;justify-content:space-between;align-items:center;z-index:30;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
.snack.show{opacity:1;transform:none;pointer-events:auto}.snack button{color:#D0BCFF;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="g"><h1 id="hi"></h1><small id="dt"></small></div>
    <button class="ib" id="bell" aria-label="التذكيرات">🔔</button>
    <button class="ib" id="eod" aria-label="إنهاء اليوم">🌙</button>
    <button class="ib" id="theme" aria-label="الوضع">◐</button>
  </header>

  <section class="sum">
    <div class="ringw"><svg viewBox="0 0 80 80"><circle class="t" cx="40" cy="40" r="34"/><circle class="v" id="rv" cx="40" cy="40" r="34"/></svg><b id="rp">0%</b></div>
    <div><h2 id="sh"></h2><p id="sp"></p></div>
  </section>

  <section class="now" id="now" hidden></section>
  <p class="nxt" id="nxt"></p>

  <div class="chips"><button class="chip on" data-d="today">اليوم</button><button class="chip" data-d="tomorrow">بكرة</button></div>
  <ul id="list"></ul>
</div>

<button class="fab" id="fab">＋ مهمة جديدة</button>
<button class="pill" id="pill" hidden></button>

<!-- إضافة مهمة -->
<div class="sheet" id="addS" hidden><div class="sb">
  <h2>مهمة جديدة</h2>
  <input type="text" id="fT" placeholder="اكتبي المهمة (مثال: مراجعة محاسبة)">
  <div class="row">
    <div><span class="lb">الوقت</span><input type="time" id="fTime" value="09:00"></div>
    <div><span class="lb">المدة</span><select id="fDur"><option value="15">15 دقيقة</option><option value="25" selected>25 دقيقة</option><option value="30">30 دقيقة</option><option value="45">45 دقيقة</option><option value="60">ساعة</option><option value="90">ساعة ونص</option><option value="120">ساعتين</option></select></div>
  </div>
  <div><span class="lb">الأولوية</span><div class="seg" id="fPri"><button data-p="high">عالية</button><button data-p="mid" class="on">متوسطة</button><button data-p="low">منخفضة</button></div></div>
  <div><span class="lb">اليوم</span><div class="seg" id="fDay"><button data-d="today" class="on">النهارده</button><button data-d="tomorrow">بكرة</button></div></div>
  <div id="fFileW" hidden><span class="lb">ملف من المكتبة (اختياري)</span><select id="fFile"><option value="">بدون ملف</option></select></div>
  <div class="row"><button class="btn" id="fSave">حفظ</button><button class="btn o" id="fCancel">إلغاء</button></div>
</div></div>

<!-- المؤقت -->
<div class="sheet" id="timS" hidden><div class="sb tm">
  <h2 id="tTitle"></h2><small id="tSess" style="color:var(--mut)"></small>
  <div class="tring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" id="tv" cx="60" cy="60" r="52"/></svg><b id="tTime">25:00</b></div>
  <div class="row" style="width:100%"><button class="btn" id="tGo">ابدأ</button><button class="btn o" id="tRst">إعادة</button></div>
  <button class="btn o" id="tClose" style="width:100%">تصغير</button>
</div></div>

<!-- نهاية اليوم -->
<div class="sheet" id="endS" hidden><div class="sb">
  <h2>ملخص اليوم</h2><p id="eTxt" style="line-height:1.8"></p>
  <button class="btn" id="eMove">رحّلي المتبقي لبكرة</button>
  <button class="btn o" id="eClose">إغلاق</button>
</div></div>

<div class="snack" id="snack"><span id="sm"></span><button id="su" hidden>تراجع</button></div>

<script>
const $=s=>$d.querySelector(s),$d=document,$$=s=>[...$d.querySelectorAll(s)],pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date()),tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return ymd(d)};
const KEY="tm_today_v1",PL={high:"عالية",mid:"متوسطة",low:"منخفضة"};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== التخزين ===== */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks))return s}catch(e){}
  const d=today(),mk=(t,time,dur,pri)=>({id:uid(),t,time,dur,pri,date:d,done:false,sessions:0,file:null});
  return{tasks:[mk("مراجعة محاسبة ضريبية","10:00",60,"high"),mk("حل واجب إحصاء","13:00",45,"mid"),mk("مفردات English","18:00",25,"low")],theme:null}}
let S=load(),day="today";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ===== الوضع الداكن ===== */
function applyTheme(){const t=S.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  $d.documentElement.dataset.theme=t;$('meta[name=theme-color]').content=t==="dark"?"#141218":"#6750A4"}
$("#theme").onclick=()=>{S.theme=$d.documentElement.dataset.theme==="dark"?"light":"dark";save();applyTheme()};

/* ===== العرض ===== */
const hm=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const visible=()=>S.tasks.filter(t=>day==="today"?(t.date===today()||(t.date<today()&&!t.done)):t.date===tomorrow())
  .sort((a,b)=>(a.done-b.done)||(a.date.localeCompare(b.date))||hm(a.time)-hm(b.time));
const dur=m=>m>=60?`${Math.floor(m/60)} س${m%60?` ${m%60} د`:""}`:`${m} د`;

function render(){
  const h=new Date().getHours();
  $("#hi").textContent=h<12?"صباح الخير ☀️":h<18?"مساء الخير 🌤":"مساء الخير 🌙";
  $("#dt").textContent=new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
  // ملخص اليوم (دايماً عن النهارده)
  const td=S.tasks.filter(t=>t.date<=today()&&(t.date===today()||!t.done)),dn=td.filter(t=>t.done).length,pct=td.length?Math.round(dn/td.length*100):0;
  const left=td.filter(t=>!t.done).reduce((a,t)=>a+t.dur,0),C=2*Math.PI*34;
  $("#rv").style.strokeDasharray=C;$("#rv").style.strokeDashoffset=C*(1-pct/100);$("#rp").textContent=pct+"%";
  $("#sh").textContent=td.length?`${dn} من ${td.length} مهام`:"يومك فاضي";
  $("#sp").textContent=td.length?(left?`فاضل ${dur(left)} من المذاكرة النهارده`:"خلصتي كل مهامك 🎉"):"ضيفي أول مهمة بزر ＋";
  // الآن / التالي
  const pend=td.filter(t=>!t.done).sort((a,b)=>hm(a.time)-hm(b.time)),now=$("#now");
  if(pend.length){const c=pend[0];now.hidden=false;
    now.innerHTML=`<small>${c.date<today()?"متأخرة — ":""}دلوقتي</small><h3>${esc(c.t)}</h3><p>${c.time} · ${dur(c.dur)}</p>
      <div class="r"><button class="nb" data-a="play" data-i="${c.id}">▶ ابدأ جلسة</button><button class="nb o" data-a="tg" data-i="${c.id}">✓ تمّت</button></div>`;
    $("#nxt").textContent=pend[1]?`بعدها: ${pend[1].t} (${pend[1].time})`:""}
  else{now.hidden=true;$("#nxt").textContent=""}
  // القائمة
  const v=visible();
  $("#list").innerHTML=v.length?v.map(t=>`<li data-id="${t.id}"><div class="sw"><span class="a">✓ تمّت</span><span class="d">🗑 حذف</span></div>
    <div class="card ${t.done?"done":""}"><span class="box" data-a="tg" data-i="${t.id}">✓</span>
    <div class="bd"><div class="tt">${esc(t.t)}</div><div class="mt"><span>${t.time}</span><span>${dur(t.dur)}</span><span class="pri ${t.pri}">${PL[t.pri]}</span>
      ${t.sessions?`<span>🍅 ${t.sessions}</span>`:""}${t.date<today()?`<span class="late">متأخرة</span>`:""}</div></div>
    <div class="ac">${t.file?`<button data-a="file" data-i="${t.id}" aria-label="الملف">📄</button>`:""}<button data-a="play" data-i="${t.id}" aria-label="ابدأ">▶</button></div></div></li>`).join("")
    :`<li class="empty">${day==="today"?"مفيش مهام لليوم":"مفيش مهام لبكرة"}</li>`;
  bindSwipe();
}
$$(".chip").forEach(c=>c.onclick=()=>{day=c.dataset.d;$$(".chip").forEach(x=>x.classList.toggle("on",x===c));render()});

/* ===== إجراءات المهام ===== */
const find=id=>S.tasks.find(t=>t.id===id);
function toggle(id){const t=find(id);if(!t)return;t.done=!t.done;save();render()}
function del(id){const i=S.tasks.findIndex(t=>t.id===id);if(i<0)return;const [t]=S.tasks.splice(i,1);save();render();
  snack("تم حذف المهمة",()=>{S.tasks.splice(i,0,t);save();render()})}
$d.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.i,t=find(id);
  if(b.dataset.a==="tg")toggle(id);else if(b.dataset.a==="play")openTimer(id);
  else if(b.dataset.a==="file"&&t&&t.file)window.open(t.file.url,"_blank")});

/* ===== السحب (يمين = تمّت، شمال = حذف) ===== */
function bindSwipe(){$$("#list li[data-id]").forEach(li=>{
  const card=li.querySelector(".card");let sx=0,dx=0,on=false;
  card.addEventListener("pointerdown",e=>{if(e.target.closest("button,.box"))return;on=true;sx=e.clientX;dx=0;card.classList.add("drag");card.setPointerCapture(e.pointerId)});
  card.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px)`});
  const end=()=>{if(!on)return;on=false;card.classList.remove("drag");card.style.transform="";
    if(dx>90)toggle(li.dataset.id);else if(dx<-90)del(li.dataset.id)};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end)})}

/* ===== إضافة مهمة ===== */
let fPri="mid",fDay="today";
const seg=(id,cb)=>$$(`#${id} button`).forEach(b=>b.onclick=()=>{$$(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b));cb(b)});
seg("fPri",b=>fPri=b.dataset.p);seg("fDay",b=>fDay=b.dataset.d);
$("#fab").onclick=()=>{$("#addS").hidden=false;$("#fT").value="";$("#fT").focus()};
$("#fCancel").onclick=()=>$("#addS").hidden=true;
$("#fSave").onclick=()=>{const t=$("#fT").value.trim();if(!t){$("#fT").focus();return}
  const fs=$("#fFile"),opt=fs.selectedOptions[0];
  S.tasks.push({id:uid(),t,time:$("#fTime").value||"09:00",dur:+$("#fDur").value,pri:fPri,date:fDay==="today"?today():tomorrow(),done:false,sessions:0,
    file:fs.value?{n:opt.textContent,url:fs.value}:null});
  save();$("#addS").hidden=true;day=fDay;$$(".chip").forEach(c=>c.classList.toggle("on",c.dataset.d===day));render()};
/* ملفات المكتبة (من files.json لو موجود) */
fetch("files.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
  const fl=(d.folders||[]).flatMap(f=>f.files.map(x=>({n:`${f.name} — ${x.n}`,url:x.url})));
  if(!fl.length)return;$("#fFileW").hidden=false;
  $("#fFile").insertAdjacentHTML("beforeend",fl.map(x=>`<option value="${esc(x.url)}">${esc(x.n)}</option>`).join(""))}).catch(()=>{});

/* ===== مؤقت المهمة (بومودورو) ===== */
const FOCUS=25*60,TC=2*Math.PI*52;let T={id:null,left:FOCUS,end:0,run:false,iv:null};
$("#tv").style.strokeDasharray=TC;
const fmt=s=>pad(Math.floor(s/60))+":"+pad(s%60);
function drawT(){const t=find(T.id);$("#tTime").textContent=fmt(T.left);$("#tv").style.strokeDashoffset=TC*(1-T.left/FOCUS);
  $("#tTitle").textContent=t?t.t:"";$("#tSess").textContent=t?`جلسات منجزة: ${t.sessions}`:"";
  $("#tGo").textContent=T.run?"إيقاف مؤقت":(T.left<FOCUS?"استكمال":"ابدأ");
  $("#pill").hidden=!(T.run&&$("#timS").hidden);$("#pill").textContent="🍅 "+fmt(T.left)}
function openTimer(id){if(T.run&&T.id!==id){snack("في جلسة شغالة على مهمة تانية");return}
  if(T.id!==id){T={id,left:FOCUS,end:0,run:false,iv:null}}$("#timS").hidden=false;drawT()}
function tick(){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(T.left<=0){clearInterval(T.iv);T.run=false;const t=find(T.id);if(t){t.sessions++;save()}T.left=FOCUS;render();
    notify("انتهت الجلسة 🍅","خدي استراحة قصيرة");navigator.vibrate&&navigator.vibrate([300,150,300]);snack("انتهت الجلسة — استراحة 5 دقايق")}
  drawT()}
$("#tGo").onclick=()=>{if(T.run){clearInterval(T.iv);T.run=false}else{T.run=true;T.end=Date.now()+T.left*1000;T.iv=setInterval(tick,500)}drawT()};
$("#tRst").onclick=()=>{clearInterval(T.iv);T.run=false;T.left=FOCUS;drawT()};
$("#tClose").onclick=()=>{$("#timS").hidden=true;drawT()};$("#pill").onclick=()=>{$("#timS").hidden=false;drawT()};

/* ===== نهاية اليوم + الترحيل ===== */
$("#eod").onclick=()=>{const td=S.tasks.filter(t=>t.date<=today()),dn=td.filter(t=>t.done),rest=td.filter(t=>!t.done);
  $("#eTxt").innerHTML=`خلصتي <b>${dn.length}</b> مهمة${rest.length?` وفاضل <b>${rest.length}</b>:<br>• ${rest.map(t=>esc(t.t)).join("<br>• ")}`:" — يوم ممتاز 🎉"}`;
  $("#eMove").hidden=!rest.length;$("#endS").hidden=false};
$("#eMove").onclick=()=>{S.tasks.forEach(t=>{if(!t.done&&t.date<=today())t.date=tomorrow()});save();$("#endS").hidden=true;render();snack("اتحوّلت المهام لبكرة")};
$("#eClose").onclick=()=>$("#endS").hidden=true;

/* ===== التذكيرات (بتشتغل والتطبيق مفتوح) ===== */
function notify(title,body){if(!("Notification"in window)||Notification.permission!=="granted")return;
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png"})).catch(()=>new Notification(title,{body}));
  else new Notification(title,{body})}
$("#bell").onclick=async()=>{if(!("Notification"in window))return snack("المتصفح مش بيدعم الإشعارات");
  const p=Notification.permission==="granted"?"granted":await Notification.requestPermission();
  snack(p==="granted"?"التذكيرات مفعّلة (والتطبيق مفتوح)":"الإشعارات مرفوضة من الإعدادات")};
const fired=new Set();setInterval(()=>{const n=new Date(),k=`${today()} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
  S.tasks.forEach(t=>{if(!t.done&&t.date===today()&&`${t.date} ${t.time}`===k&&!fired.has(t.id+k)){fired.add(t.id+k);notify("حان وقت: "+t.t,`${dur(t.dur)} · ${PL[t.pri]}`)}})},20000);

/* ===== رسالة سفلية ===== */
let sh,undo=null;function snack(m,u){$("#sm").textContent=m;undo=u||null;$("#su").hidden=!u;$("#snack").classList.add("show");clearTimeout(sh);sh=setTimeout(()=>$("#snack").classList.remove("show"),u?4500:2400)}
$("#su").onclick=()=>{if(undo)undo();undo=null;$("#snack").classList.remove("show")};

/* ===== تشغيل ===== */
applyTheme();render();
setInterval(()=>{if(!$d.hidden)render()},60000);
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
